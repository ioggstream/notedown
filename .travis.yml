language: python

dist: jammy
sudo: no

python:
  - 3.8
  - 3.9
  - "3.10"
  - "3.11"
  - "3.12"

env:
  matrix:
    - PEP=false

matrix:
  include:
    - python: 3.8
      env: PEP=true

addons:
  apt:
    sources:
      - r-packages-precise
    packages:
      - r-base-dev

cache:
  directories:
    - ~/Rlib

before_install:
  - R --version
  - Rscript --version

  # set user install directory and CRAN repo
  - mkdir -p ~/Rlib
  - ls ~/Rlib
  - echo 'R_LIBS=~/Rlib' > ~/.Renviron
  - echo 'options(repos = "http://cran.rstudio.com")' > ~/.Rprofile

  - cat ~/.Renviron
  - cat ~/.Rprofile

  # install knitr (takes a while to build everything)
  - Rscript -e "install.packages('knitr', dependencies=TRUE)"

  # check that knitr actually installed
  - Rscript -e 'require(knitr)'
  - Rscript -e '.libPaths()'
  - ls ~/Rlib

install:
  - pip install flake8
  - pip install .

script:
  - if $PEP; then flake8 notedown --max-line-length=120; fi
  - if ! $PEP; then pytest tests.py -v; fi
